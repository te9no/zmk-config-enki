#
# Enki Shield configuration
#

# ---- Basic Info ----
CONFIG_ZMK_KEYBOARD_NAME="Enki Counter"
CONFIG_CHECK_INIT_PRIORITIES=n

# ---- Logging / Debug ----
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# ---- Display & UI ----
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_USE_LABEL=y
CONFIG_PWM=y                      # Backlight control

# ---- Connectivity & Split ----
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_HID_INDICATORS=y

# ---- Buses & Generic Devices ----
CONFIG_SPI=y                      # Display communication
CONFIG_I2C=y                      # Touch / sensors
CONFIG_INPUT=y
CONFIG_ADC=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ---- Pointing & Touch ----
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT_CST816S=y
CONFIG_INPUT_CST816S_INTERRUPT=y

# ---- PMW3610 Optical Sensor ----
CONFIG_PMW3610=y
CONFIG_PMW3610_SWAP_XY=n
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=14
CONFIG_PMW3610_LOG_LEVEL_WRN=y
